[project]
name = "xrds-snn-hello-world"
version = "0.1.0"
description = "Companion notebook for the XRDS Hello World column on spiking neural networks and event cameras."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "brian2>=2.10.1",
    "eventify-dvs>=0.2.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
]
